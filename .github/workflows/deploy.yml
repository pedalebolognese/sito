# Pubblica il sito su Cloudflare:
#  - a ogni salvataggio dal pannello (push su main)
#  - ogni notte alle 4 (le uscite passate diventano "passate", si aggiorna la home)
#  - a mano, da GitHub > Actions > Pubblica sito > Run workflow
#
# Variabili del repository (Settings > Secrets and variables > Actions > Variables):
#   WORKER_NAME        pedalebolognese-anteprima (demo) | pedalebolognese (sito ufficiale)
#   SITE_URL           indirizzo pubblico del sito
#   PUBLIC_DEMO        1 per la fascia "Anteprima" e il noindex, vuoto per il sito ufficiale
#   PUBLIC_MEDIA_BASE  indirizzo dell'archivio foto su R2
# Segreti (stessa pagina, scheda Secrets): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
name: Pubblica sito

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'      # 03:00 UTC = 04:00 in inverno, 05:00 in estate
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_DEMO: ${{ vars.PUBLIC_DEMO }}
          PUBLIC_MEDIA_BASE: ${{ vars.PUBLIC_MEDIA_BASE }}
          PUBLIC_CALENDAR_SUBSCRIBE: ${{ vars.PUBLIC_CALENDAR_SUBSCRIBE }}
          GOOGLE_CALENDAR_ICS: ${{ secrets.GOOGLE_CALENDAR_ICS }}
          PERCORSI_CSV: ${{ vars.PERCORSI_CSV }}
      - run: npx wrangler deploy --name "${{ vars.WORKER_NAME || 'pedalebolognese' }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
